function renderHome(){let visible=tasks.filter(t=>filter==='all'||filter==='mine'&&t.person==='Я'||filter==='others'&&t.person!=='Я'||filter==='done'&&t.done);pageRoot.innerHTML=`<div class="view"><div class="greeting"><div><div class="eyebrow">${new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(TODAY).toLocaleUpperCase('ru-RU')}</div><h1>Привет, ${esc(profileName)}<span style="color:#a9d749">.</span></h1></div><div class="date">${streakDays?`✦ ${streakDays} ${streakDays===1?'день':'дня'} подряд`:''}</div></div><section class="streak"><div><div class="streak-label">ОГОНЁК ЗАДАНИЙ</div><div class="streak-num"><span>🔥 ${streakDays}</span><small> дней подряд</small></div></div><div class="streak-right">Выполни дело сегодня ↗</div></section><div class="section-head"><h2>Мои обещания</h2><button id="share-open">Поделиться ↗</button></div><div class="filters"><button class="filter ${filter==='all'?'active':''}" data-filter="all">Все ${tasks.length}</button><button class="filter ${filter==='mine'?'active':''}" data-filter="mine">Мои</button><button class="filter ${filter==='others'?'active':''}" data-filter="others">Другим</button><button class="filter ${filter==='done'?'active':''}" data-filter="done">Готово ✓</button></div><section class="task-list">${visible.length?visible.map(t=>{let hd=humanDate(t.dueDate);return `<article class="task ${t.done?'done':''}" data-id="${t.id}"><button class="check" data-check="${t.id}" aria-label="Отметить выполненным"><svg viewBox="0 0 24 24" fill="none" stroke="#263315" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></button><div class="task-main" data-edit="${t.id}"><div class="task-icon" style="background:${t.color||'var(--soft)'}">${esc(t.icon||'✦')}</div><div style="min-width:0"><div class="task-title">${esc(t.title)}</div><div class="task-meta"><span class="person">${esc(t.person)}</span>${t.image?'<span>· фото ниже</span>':'<span>· обещание</span>'}</div></div>${t.image?`<img src="${t.image}" class="preview task-thumb" data-image="${t.id}" alt="Фото к обещанию">`:''}</div><span class="due ${hd==='Сегодня'?'today':hd==='Завтра'?'tomorrow':''}" data-edit="${t.id}"><span class="flame ${heat(t.dueDate)}">🔥</span>${esc(hd)}${t.dueTime?` · ${esc(t.dueTime)}`:''}</span></article>`}).join(''):'<div class="empty">Пока здесь пусто. Добавим обещание?</div>'}</section></div>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderHome()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=e=>{e.stopPropagation();const t=tasks.find(x=>x.id==b.dataset.check);if(!t.done){t.done=true;t.completedAt=Date.now();const last=Number(localStorage.getItem('promiseLastDone')||0),gap=Math.floor((new Date().setHours(0,0,0,0)-new Date(last).setHours(0,0,0,0))/86400000);if(!last||gap>1||streakDays===0)streakDays=1;else if(gap===1)streakDays++;localStorage.setItem('promiseLastDone',Date.now());localStorage.setItem('promiseStreak_v2',streakDays)}else{t.done=false;t.completedAt=null;const anyDoneToday=tasks.some(x=>x.done&&x.completedAt&&new Date(x.completedAt).toDateString()===new Date().toDateString());if(!anyDoneToday&&new Date(Number(localStorage.getItem('promiseLastDone')||0)).toDateString()===new Date().toDateString()){streakDays=0;localStorage.setItem('promiseStreak_v2','0')}}save();renderHome();toast(t.done?'Красиво. Огонёк продлён 🔥':'Задача снова активна')});document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openEdit(el.dataset.edit));document.querySelectorAll('[data-image]').forEach(el=>el.onclick=e=>{e.stopPropagation();openLightbox(tasks.find(t=>t.id==el.dataset.image)?.image)});$('#share-open').onclick=openShare}
function renderPeople(){pageRoot.innerHTML=`<div class="view"><div class="page-title">Люди</div><div class="sub">Добавляй друзей и назначай им обещания.</div><div class="panel"><h3>Добавить человека</h3><label class="label">TELEGRAM-ЮЗЕРНЕЙМ</label><input class="input" id="user-handle" placeholder="@username"><label class="label">КАК НАЗЫВАТЬ ДРУГА?</label><input class="input" id="user-nick" placeholder="Имя для списка (необязательно)"><button class="primary" id="add-person">Добавить вручную</button><p class="tiny">В демо-версии ник и аватар Telegram не подгружаются. Для поиска контактов, фото и проверки юзернейма нужно подключить бота и Telegram API.</p></div><div class="panel"><h3>Мои люди · ${contacts.length}</h3>${contacts.length?contacts.map((c,i)=>`<div class="contact"><div class="contact-avatar">${esc(c.avatar||'👤')}</div><div class="contact-info"><div class="contact-name">${esc(c.name)}</div><div class="contact-user">${esc(c.username)}</div></div><button class="btn alt" data-assign="${i}">Назначить</button><button class="close" data-remove="${i}">×</button></div>`).join(''):'<div class="empty">Добавь человека по юзернейму. Его можно назначить ответственным за задачу.</div>'}</div><div class="panel"><h3>Общий список</h3><p class="tiny">Создай приглашение, чтобы близкие могли открыть общий список. Сейчас ссылка демонстрационная: для синхронизации изменений между аккаунтами потребуется сервер.</p><button class="btn" id="share-people">Пригласить в список ↗</button></div></div>`;$('#add-person').onclick=()=>{let u=$('#user-handle').value.trim().replace(/^@/,'');if(!u){toast('Введи юзернейм');return}let nick=$('#user-nick').value.trim();contacts.push({username:'@'+u,name:nick||'@'+u,avatar:'👤'});localStorage.setItem('promisePeople',JSON.stringify(contacts));renderPeople();toast('Добавили в твой список')};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{contacts.splice(+b.dataset.remove,1);localStorage.setItem('promisePeople',JSON.stringify(contacts));renderPeople()});document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>{page='home';render();openCreate(contacts[+b.dataset.assign].name)});$('#share-people').onclick=openShare}
function renderStats(){let now=Date.now(),start=period==='day'?new Date(TODAY).getTime():period==='week'?now-7*86400000:now-30*86400000;let scope=tasks.filter(t=>(t.completedAt||t.createdAt||0)>=start),done=scope.filter(t=>t.done).length,open=scope.filter(t=>!t.done).length,late=tasks.filter(t=>!t.done&&t.dueDate&&dayDiff(t.dueDate)<0).length,total=done+open,pct=total?Math.round(done/total*100):0;let days=period==='day'?['Утро','День','Вечер']:period==='week'?['Пн','Вт','Ср','Чт','Пт','Сб','Вс']:['1 нед','2 нед','3 нед','4 нед'];let finished=tasks.filter(t=>t.done&&t.completedAt),bins=days.map((_,i)=>{let from,to;if(period==='day'){let h=[0,8,16][i];from=new Date(TODAY);from.setHours(h,0,0,0);to=new Date(from);to.setHours(to.getHours()+8)}else if(period==='week'){let d=new Date(TODAY);d.setDate(d.getDate()-(6-i));from=new Date(d);from.setHours(0,0,0,0);to=new Date(from);to.setDate(to.getDate()+1)}else{from=new Date(TODAY);from.setDate(from.getDate()-(27-i*7));from.setHours(0,0,0,0);to=new Date(from);to.setDate(to.getDate()+7)}return finished.filter(t=>t.completedAt>=from.getTime()&&t.completedAt<to.getTime()).length}),maxBin=Math.max(1,...bins);pageRoot.innerHTML=`<div class="view"><div class="page-title">Статистика</div><div class="sub">Маленькие обещания складываются в большие дела.</div><div class="segmented">${[['day','День'],['week','Неделя'],['month','Месяц']].map(([id,name])=>`<button class="${period===id?'active':''}" data-period="${id}">${name}</button>`).join('')}</div><div class="panel"><h3>Твой ритм</h3><div class="metric-grid"><div class="metric"><strong>${done}</strong><span>выполнено</span></div><div class="metric"><strong>${open}</strong><span>ещё впереди</span></div><div class="metric"><strong>${pct}%</strong><span>доля выполнения</span></div><div class="metric"><strong>${late}</strong><span>просрочено</span></div></div><div class="progress" style="height:7px;margin-top:15px"><i style="width:${pct}%"></i></div><div class="progressrow"><span>Выполнено за период</span><span>${done} из ${total}</span></div></div><div class="panel"><h3>Активность</h3><div class="chart">${days.map((d,i)=>`<div class="barwrap"><div class="bar" title="${bins[i]} выполнено" style="height:${Math.max(4,bins[i]/maxBin*100)}%"></div><span class="barlabel">${d}</span></div>`).join('')}</div></div></div>`;document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;renderStats()})}
function renderProfile(){pageRoot.innerHTML=`<div class="view"><div class="page-title">Профиль</div><div class="panel profile-hero"><div class="profile-big">🧑🏻‍🦱</div><h2>${esc(profileName)}</h2><p>@abby · в «держу слово» с ноября</p><button class="btn alt" id="edit-name">Изменить имя</button></div><div class="panel"><h3>Твои достижения</h3><div class="metric-grid"><div class="metric"><strong>${streakDays} 🔥</strong><span>дней огонька</span></div><div class="metric"><strong>${tasks.filter(t=>t.done).length} ✓</strong><span>сдержанных обещаний</span></div></div></div><div class="panel"><h3>Настройки</h3><div class="pref"><span>Тёмная тема</span><input class="switch" type="checkbox" id="theme-switch" ${document.body.classList.contains('dark')?'checked':''}></div><div class="pref"><span>Напоминать о сроках</span><input class="switch" type="checkbox" id="reminders" checked></div><div class="pref"><span>Показывать огонёк у срока</span><input class="switch" type="checkbox" id="flames" checked></div></div><div class="panel"><h3>Мой список</h3><p class="tiny">Список виден только тебе. Поделись ссылкой, чтобы пригласить близких к совместному списку.</p><button class="btn" id="profile-share">Настроить общий доступ ↗</button></div><div class="panel"><button class="btn alt" id="reset-demo">Сбросить демо-данные</button></div></div>`;$('#theme-switch').onchange=toggleTheme;$('#edit-name').onclick=()=>{let n=prompt('Как тебя называть?',profileName);if(n){profileName=n.trim()||profileName;localStorage.setItem('promiseProfileName',profileName);renderProfile()}};$('#profile-share').onclick=openShare;$('#reset-demo').onclick=()=>{localStorage.removeItem(KEY);tasks=[];save();renderProfile();toast('Список очищен')}}
function openModal(html,compact=false){modalRoot.innerHTML=`<div class="modal-bg show" id="modal-bg"><section class="modal ${compact?'compact':''}">${html}</section></div>`;$('#modal-bg').onclick=e=>{if(e.target.id==='modal-bg')closeModal()};let close=$('#close-modal');if(close)close.onclick=closeModal}function closeModal(){modalRoot.innerHTML=''}function openCreate(assign=''){chosenEmoji='✦';imageData='';let today=localToday;openModal(`<div class="modal-top"><h3>Новое обещание</h3><button class="close" id="close-modal">×</button></div><label class="label">ЧТО НУЖНО СДЕЛАТЬ?</label><input class="input" id="task-input" placeholder="Например, купить корм Барсику…" maxlength="90" required><div class="row"><div><label class="label">КОМУ?</label><select class="input" id="task-person"><option>Я</option>${contacts.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div><label class="label">СВОЁ ИМЯ</label><input class="input" id="custom-person" placeholder="или впиши имя"></div></div><label class="label">КОГДА?</label><div class="quickdates"><button type="button" data-quick="0">Сегодня</button><button type="button" data-quick="1">Завтра</button><button type="button" data-quick="2">Послезавтра</button></div><input class="input" type="date" id="date-input" value="${today}"><label class="label">ВРЕМЯ И УВЕДОМЛЕНИЯ</label><div class="row"><input class="input" type="time" id="time-input"><span class="tiny" style="align-self:center">Уведомления появятся после подключения бота</span></div><div class="reminder-options"><label><input type="checkbox" name="reminder" value="60" checked> за час</label><label><input type="checkbox" name="reminder" value="15" checked> за 15 минут</label><label><input type="checkbox" name="reminder" value="0" checked> вовремя</label></div><label class="label">ЭМОДЗИ</label><div class="emoji-row">${['✦','🛒','🏠','📦','📞','💊','🍰','🐈','💼','🎁','🧹','📎','✈️','🌱'].map((e,i)=>`<button type="button" class="emoji ${i===0?'active':''}" data-emoji="${e}">${e}</button>`).join('')}</div><label class="label">ДОБАВИТЬ ФОТО (НЕОБЯЗАТЕЛЬНО)</label><div class="attachment"><input type="file" accept="image/*" id="task-image" class="input" style="padding:8px;font-size:10px"><span id="image-label" class="tiny">Фото товара или заметки</span></div><button class="primary" id="save-task">Добавить обещание</button>`);$('#task-person').value=assign?'Я':'Я';if(assign)$('#custom-person').value=assign;document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{let d=new Date(TODAY);d.setDate(d.getDate()+Number(b.dataset.quick));$('#date-input').value=iso(d);document.querySelectorAll('[data-quick]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{chosenEmoji=b.dataset.emoji;document.querySelectorAll('[data-emoji]').forEach(x=>x.classList.toggle('active',x===b))});$('#task-image').onchange=async e=>{let f=e.target.files[0];if(!f)return;imageData=await compressImage(f);$('#image-label').textContent='Фото добавлено ✓'};$('#save-task').onclick=()=>{let title=$('#task-input').value.trim();if(!title){toast('Напиши, что нужно сделать');return}let p=$('#custom-person').value.trim()||$('#task-person').value||'Я';tasks.unshift({id:Date.now(),title,person:p,dueDate:$('#date-input').value||null,dueTime:$('#time-input').value||null,reminders:$('#time-input').value?[...document.querySelectorAll('input[name=reminder]:checked')].map(x=>Number(x.value)):[],icon:chosenEmoji,image:imageData,done:false,createdAt:Date.now()});save();closeModal();page='home';filter='all';render();toast('Обещание добавлено ✓')}}
function compressImage(file){return new Promise(resolve=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}
function openEdit(id){let t=tasks.find(x=>x.id==id);if(!t)return;chosenEmoji=t.icon||'✦';imageData=t.image||'';openModal(`<div class="modal-top"><h3>Детали обещания</h3><button class="close" id="close-modal">×</button></div>${t.image?`<img src="${t.image}" class="preview" id="task-image-preview" style="max-width:100%;max-height:190px;display:block;margin-bottom:12px">`:''}<label class="label">НАЗВАНИЕ</label><input class="input" id="edit-title" value="${esc(t.title)}"><label class="label">ОТВЕТСТВЕННЫЙ</label><input class="input" id="edit-person" value="${esc(t.person)}"><label class="label">СРОК</label><div class="quickdates">${[0,1,2].map((n)=>`<button type="button" data-editquick="${n}">${['Сегодня','Завтра','Послезавтра'][n]}</button>`).join('')}</div><input class="input" type="date" id="edit-date" value="${t.dueDate||''}"><label class="label">ВРЕМЯ И УВЕДОМЛЕНИЯ</label><div class="row"><input class="input" type="time" id="edit-time" value="${t.dueTime||''}"><span class="tiny" style="align-self:center">Доставка — после подключения бота</span></div><div class="reminder-options">${[[60,'за час'],[15,'за 15 минут'],[0,'вовремя']].map(([v,l])=>`<label><input type="checkbox" name="edit-reminder" value="${v}" ${(t.reminders||[60,15,0]).includes(v)?'checked':''}> ${l}</label>`).join('')}</div><label class="label">ЭМОДЗИ / ФОТО</label><div class="attachment"><input type="file" accept="image/*" id="edit-image" class="input" style="padding:8px;font-size:10px"><button class="btn alt" id="remove-image">Убрать фото</button></div><div class="emoji-row" style="margin-top:8px">${['✦','🛒','🏠','📦','📞','💊','🍰','🐈','💼','🎁','🧹','📎'].map(e=>`<button type="button" class="emoji ${e===chosenEmoji?'active':''}" data-edit-emoji="${e}">${e}</button>`).join('')}</div><div class="drawer-actions"><button class="btn alt danger" id="delete-task">Удалить</button><button class="btn" id="save-edit">Сохранить</button></div>`);$('#task-image-preview')?.addEventListener('click',()=>openLightbox(t.image));document.querySelectorAll('[data-editquick]').forEach(b=>b.onclick=()=>{let d=new Date(TODAY);d.setDate(d.getDate()+Number(b.dataset.editquick));$('#edit-date').value=iso(d)});document.querySelectorAll('[data-edit-emoji]').forEach(b=>b.onclick=()=>{chosenEmoji=b.dataset.editEmoji;document.querySelectorAll('[data-edit-emoji]').forEach(x=>x.classList.toggle('active',x===b))});$('#edit-image').onchange=async e=>{if(e.target.files[0])imageData=await compressImage(e.target.files[0])};$('#remove-image').onclick=()=>{imageData='';toast('Фото убрано')};$('#delete-task').onclick=()=>{tasks=tasks.filter(x=>x.id!=id);save();closeModal();render();toast('Обещание удалено')};$('#save-edit').onclick=()=>{t.title=$('#edit-title').value.trim()||t.title;t.person=$('#edit-person').value.trim()||'Я';t.dueDate=$('#edit-date').value||null;t.dueTime=$('#edit-time').value||null;t.reminders=$('#edit-time').value?[...document.querySelectorAll('input[name=edit-reminder]:checked')].map(x=>Number(x.value)):[];t.icon=chosenEmoji;t.image=imageData;save();closeModal();render();toast('Изменения сохранены')}}
function openLightbox(src){let box=document.createElement('div');box.className='modal-bg show';box.style.cssText='align-items:center;z-index:10';box.innerHTML=`<img src="${src}" style="max-width:96vw;max-height:90vh;object-fit:contain;border-radius:12px">`;box.onclick=()=>box.remove();document.body.appendChild(box)}function openShare(){let link='https://t.me/derzhubot?startapp=list_'+Math.random().toString(36).slice(2,10);openModal(`<div class="modal-top"><h3>Общий список</h3><button class="close" id="close-modal">×</button></div><div class="panel"><div style="font-size:30px">🔗</div><h3>Пригласи близких</h3><p class="tiny">В настоящем Mini App ссылка откроет список участнику, а его изменения появятся у остальных. Telegram-ссылка подготовлена для будущего подключения бота. До настройки username бота и сервера список по ней не откроется, синхронизации пока нет.</p><div class="share-link">${esc(link)}</div><button class="primary" id="copy-link">Скопировать ссылку</button></div><p class="tiny">Если человек открывает бота сам, без приглашения, ему показывается только его личный список.</p>`);$('#copy-link').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Ссылка скопирована')}catch{toast('Ссылка готова к копированию')}}}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('promiseTheme',document.body.classList.contains('dark')?'dark':'light');$('#theme-icon').textContent=document.body.classList.contains('dark')?'☾':'☼';if(page==='profile')renderProfile()}$('#theme-toggle').onclick=toggleTheme;$('#avatar-open').onclick=()=>{page='profile';render()};$('#add-btn').onclick=()=>openCreate();document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.body.classList.toggle('dark',localStorage.getItem('promiseTheme')==='dark');$('#theme-icon').textContent=document.body.classList.contains('dark')?'☾':'☼';render();
</script></body></html>
